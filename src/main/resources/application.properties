# تنظیمات سرور
server.port=8080

# اتصال به دیتابیس H2 به صورت فایل (داده‌ها در رمپه‌ی پوشه پروژه یا مسیر مشخص ذخیره می‌شوند)
spring.datasource.url=jdbc:h2:file:./data/minilmsdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# تنظیمات جی‌پی‌ای و هایبرنت (ساخت و به‌روزرسانی خودکار جدول‌ها)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# فعال‌سازی کنسول H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
